# SPDX-License-Identifier: Apache-2.0
name: Deploy Architecture & Verification Showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble static site (WCAG 2.2 AA Showcase + Media + White Paper + FAIR/LLMs Metadata)
        run: |
          mkdir -p _site/media _site/dist _site/results
          cp docs/index.html _site/index.html
          cp docs/media/social-preview.svg _site/media/social-preview.svg
          cp dist/Donahue_2026_omega_triscale_observatory.pdf _site/dist/
          cp results/mutation_audit.json results/benchmarks.json results/citation-audit.json _site/results/
          cp llms.txt llms-full.txt croissant.json ro-crate-metadata.json codemeta.json CITATION.cff CHECKSUMS.sha256 _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
